        /* Enhanced styles for PDF display */
        .pdf-container {
            margin: 120px auto 50px auto;
            border-radius: 10px;
            overflow: hidden;
            padding: 0;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .pdf-controls {
            text-align: center;
            margin: 30px auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: fit-content;
        }

        #prev-page,
        #next-page,
        #download-pdf {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #prev-page:hover,
        #next-page:hover,
        #download-pdf:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }

        #page-info {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 20px;
            vertical-align: middle;
        }

        #pdf-render {
            border: none;
            outline: none;
            display: block;
            margin: auto;
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        
        /* Add overlay for clickable links */
        #pdf-links-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none; /* Let events pass through by default */
        }
        
        /* Style for highlighted link areas */
        .pdf-link-area {
            position: absolute;
            background-color: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.3);
            cursor: pointer;
            pointer-events: auto; /* Make link areas clickable */
            transition: background-color 0.2s;
        }
        
        .pdf-link-area:hover {
            background-color: rgba(0, 123, 255, 0.2);
        }

            font-size: 2.5rem;

            color: #0d6efd;

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.1.81/pdf.min.js"></script>
<script>
    const url = 'Resume.pdf';
    
    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        currentScale = 1.5,
        currentPage = null,
        currentPageLinks = [];

    const canvas = document.getElementById('pdf-render'),
          ctx = canvas.getContext('2d'),
          linksOverlay = document.getElementById('pdf-links-overlay');

    // Specify PDF.js worker source
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.1.81/pdf.worker.min.js';

    // Calculate proper scaling for viewport
    function resizeCanvas(viewport) {
        const container = document.querySelector('.pdf-container');
        const containerWidth = container.clientWidth;
        
        // Calculate scale to fit the PDF width to container
        const scaleFactor = containerWidth / viewport.width;
        
        // Set canvas dimensions
        canvas.height = viewport.height * scaleFactor;
        canvas.width = viewport.width * scaleFactor;
        
        // Update links overlay size
        linksOverlay.style.width = canvas.width + 'px';
        linksOverlay.style.height = canvas.height + 'px';
        
        return scaleFactor;
    }

    // Extract and handle links in the PDF
    function setupPdfLinks(page, scaleFactor) {
        // Clear previous links
        linksOverlay.innerHTML = '';
        currentPageLinks = [];
        
        // Get annotations (which include links)
        page.getAnnotations().then(annotations => {
            annotations.forEach(annotation => {
                if (annotation.subtype === 'Link' && annotation.url) {
                    const rect = annotation.rect;
                    const [x1, y1, x2, y2] = rect;
                    
                    // Convert PDF coordinates to canvas coordinates
                    const adjustedViewport = page.getViewport({ scale: currentScale * scaleFactor });
                    const transform = adjustedViewport.transform;
                    
                    // Create link element
                    const linkElement = document.createElement('a');
                    linkElement.className = 'pdf-link-area';
                    linkElement.href = annotation.url;
                    linkElement.target = '_blank'; // Open links in new tab
                    linkElement.title = annotation.url;
                    
                    // Position the link
                    const width = (x2 - x1) * transform[0] * scaleFactor;
                    const height = (y2 - y1) * transform[3] * scaleFactor;
                    const left = x1 * transform[0] * scaleFactor;
                    // PDF coordinates start from bottom, need to invert for DOM
                    const top = adjustedViewport.height - y2 * transform[3] * scaleFactor;
                    
                    linkElement.style.width = width + 'px';
                    linkElement.style.height = height + 'px';
                    linkElement.style.left = left + 'px';
                    linkElement.style.top = top + 'px';
                    
                    // For debugging only - show link areas
                    // linkElement.innerText = annotation.url;
                    
                    // Add to overlay
                    linksOverlay.appendChild(linkElement);
                    currentPageLinks.push({
                        element: linkElement,
                        url: annotation.url
                    });
                }
            });
        });
    }

    // Render the page
    const renderPage = num => {
        pageIsRendering = true;

        // Get page
        pdfDoc.getPage(num).then(page => {
            currentPage = page;
            const viewport = page.getViewport({ scale: currentScale });
            
            // Resize canvas to fit container
            const scaleFactor = resizeCanvas(viewport);
            
            const adjustedViewport = page.getViewport({ scale: currentScale * scaleFactor });

            const renderContext = {
                canvasContext: ctx,
                viewport: adjustedViewport
            };

            const renderTask = page.render(renderContext);

            renderTask.promise.then(() => {
                pageIsRendering = false;
                
                // Extract and setup links
                setupPdfLinks(page, scaleFactor);

                if (pageNumIsPending !== null) {
                    renderPage(pageNumIsPending);
                    pageNumIsPending = null;
                }
            });

            // Output current page
            document.getElementById('page-num').textContent = num;
        });
    };

    // Check for pages rendering
    const queueRenderPage = num => {
        if (pageIsRendering) {
            pageNumIsPending = num;
        } else {
            renderPage(num);
        }
    };

    // Show prev page
    const showPrevPage = () => {
        if (pageNum <= 1) {
            return;
        }
        pageNum--;
        queueRenderPage(pageNum);
    };

    // Show next page
    const showNextPage = () => {
        if (pageNum >= pdfDoc.numPages) {
            return;
        }
        pageNum++;
        queueRenderPage(pageNum);
    };

    // Zoom functions
    const zoomIn = () => {
        currentScale += 0.25;
        queueRenderPage(pageNum);
    };

    const zoomOut = () => {
        if (currentScale > 0.5) {
            currentScale -= 0.25;
            queueRenderPage(pageNum);
        }
    };

    // Get document
    pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
        pdfDoc = pdfDoc_;

        document.getElementById('page-count').textContent = pdfDoc.numPages;

        renderPage(pageNum); // Initial page rendering
    }).catch(err => {
        console.error('Error loading PDF:', err);
        alert('Error loading PDF: ' + err.message);
    });

    // Handle window resize to adjust PDF display
    window.addEventListener('resize', () => {
        if (pdfDoc && currentPage) {
            renderPage(pageNum);
        }
    });

    // Add keyboard controls
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            showNextPage();
        } else if (e.key === 'ArrowLeft') {
            showPrevPage();
        } else if (e.key === '+' || e.key === '=') {
            zoomIn();
        } else if (e.key === '-') {
            zoomOut();
        }
    });

    // Setup zoom with mouse wheel + Ctrl key
    canvas.addEventListener('wheel', (e) => {
        if (e.ctrlKey) {
            e.preventDefault(); // Prevent page scroll
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }
    });

    // Register event listeners for navigation buttons
    document.getElementById('prev-page').addEventListener('click', showPrevPage);
    document.getElementById('next-page').addEventListener('click', showNextPage);
</script>
